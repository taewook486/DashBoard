services:
  - type: web
    name: dashboard-market-analysis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python flask_app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG        
      - key: GOOGLE_API_KEY
        value: ${{ secrets.GOOGLE_API_KEY }}
      - key: OPENAI_API_KEY
        value: ${{ secrets.OPENAI_API_KEY }}
      - key: FRED_API_KEY
        value: ${{ secrets.FRED_API_KEY }}
      - key: DATA_DIR
        value: ./us_market/data
